<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!--
      Content Security Policy: strict same-origin. No remote scripts, no
      remote styles, no remote fonts — Outfit is self-hosted via
      @fontsource/outfit and bundled into /assets/. 'unsafe-inline' on
      script-src is dropped (theme bootstrap moved to /theme-init.js).
      'unsafe-inline' on style-src remains, required for React's
      inline-style pattern used throughout App.jsx.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none';" />
    <meta name="referrer" content="no-referrer" />
    <title>Deal Breaker</title>
    <meta name="theme-color" content="#9d85ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Deal Breaker" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/theme-init.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
